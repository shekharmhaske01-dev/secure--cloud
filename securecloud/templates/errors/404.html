{% extends "base.html" %}
{% block title %}Not found{% endblock %}
{% block content %}
<section class="card error-card">
  <p class="error-code">404</p>
  <h1>Not found</h1>
  <p class="lead">
    {{ error_message or "The page or file you requested does not exist." }}
  </p>
  <div class="btn-row">
    <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">Back to home</a>
    {% if current_user %}<a class="btn btn-ghost" href="{{ url_for('files.index') }}">My files</a>{% endif %}
  </div>
</section>
{% endblock %}
