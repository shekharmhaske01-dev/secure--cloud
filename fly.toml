# fly.toml — Fly.io deployment configuration for SecureCloud

app = "securecloud"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  FLASK_ENV = "production"
  SECURECLOUD_STORAGE_BACKEND = "local"
  SECURECLOUD_SESSION_COOKIE_SECURE = "true"
  LOG_LEVEL = "INFO"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[mounts]
  source = "securecloud_data"
  destination = "/app/persistent"
  initial_size = "1"

[deploy]
  release_command = "python -c \"from securecloud import create_app; from securecloud.extensions import db; app=create_app('production'); app.app_context().push(); db.create_all(); print('DB ready')\""
